# Derived from presidio_analyzer/conf/default_recognizers.yaml: supported_languages=es,
# keeping only language-agnostic recognizers and those that support es.
supported_languages:
- es
global_regex_flags: 26
recognizers:
- name: CreditCardRecognizer
  supported_languages:
  - language: en
    context:
    - credit
    - card
    - visa
    - mastercard
    - cc
    - amex
    - discover
    - jcb
    - diners
    - maestro
    - instapayment
  - language: es
    context:
    - tarjeta
    - credito
    - visa
    - mastercard
    - cc
    - amex
    - discover
    - jcb
    - diners
    - maestro
    - instapayment
  - language: it
  - language: pl
  type: predefined
- name: EsNifRecognizer
  supported_languages:
  - es
  type: predefined
  country_code: es
- name: EsNieRecognizer
  supported_languages:
  - es
  type: predefined
  country_code: es
- name: EsPassportRecognizer
  supported_languages:
  - es
  type: predefined
  enabled: false
  country_code: es
- name: CryptoRecognizer
  type: predefined
- name: DateRecognizer
  type: predefined
- name: EmailRecognizer
  type: predefined
- name: IbanRecognizer
  type: predefined
- name: IpRecognizer
  type: predefined
- name: MedicalLicenseRecognizer
  type: predefined
  country_code: us
- name: MacAddressRecognizer
  type: predefined
- name: UuidRecognizer
  type: predefined
- name: PhoneRecognizer
  type: predefined
- name: UrlRecognizer
  type: predefined
- name: InVoterRecognizer
  type: predefined
  enabled: false
  country_code: in
